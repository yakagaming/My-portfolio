<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Film Zone</title>

    <!-- Google Font -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >

    <!-- Login CSS -->
    <link
        rel="stylesheet"
        href="login.css"
    >

</head>


<body>


<!-- =====================================================
     LOGIN PAGE
===================================================== -->

<main class="login-page">


    <!-- BACKGROUND -->
    <div class="login-bg"></div>

    <div class="login-overlay"></div>


    <!-- BACK TO HOME -->
    <a
        href="index.html"
        class="back-home"
    >

        <i class="fa-solid fa-arrow-left"></i>

        <span>
            Back to Film Zone
        </span>

    </a>



    <!-- LOGIN CARD -->

    <section class="login-card">


        <!-- LOGO -->

        <a
            href="index.html"
            class="login-logo"
        >

            Film
            <span>
                Zone
            </span>

        </a>


        <!-- ICON -->

        <div class="login-icon">

            <i class="fa-solid fa-user"></i>

        </div>


        <!-- HEADING -->

        <span class="login-small-title">
            WELCOME BACK
        </span>


        <h1>
            Login to
            <span>
                Film Zone
            </span>
        </h1>


        <p class="login-description">

            Sign in to your account and
            continue your entertainment journey.

        </p>



        <!-- FORM -->

        <form
            id="loginForm"
            class="login-form"
        >


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email Address
                </label>


                <div class="input-wrapper">

                    <i class="fa-regular fa-envelope"></i>


                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>

            </div>



            <!-- PASSWORD -->

            <div class="input-group">

                <div class="password-label">

                    <label for="password">
                        Password
                    </label>

                    <a
                        href="#"
                        id="forgotPassword"
                    >
                        Forgot Password?
                    </a>

                </div>


                <div class="input-wrapper">

                    <i class="fa-solid fa-lock"></i>


                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        aria-label="Show password"
                    >

                        <i class="fa-regular fa-eye"></i>

                    </button>

                </div>

            </div>



            <!-- REMEMBER -->

            <label class="remember">

                <input
                    type="checkbox"
                    id="remember"
                >

                <span>
                    Remember me
                </span>

            </label>



            <!-- LOGIN BUTTON -->

            <button
                type="submit"
                class="login-submit"
                id="loginSubmit"
            >

                <span>
                    Login
                </span>

                <i class="fa-solid fa-arrow-right"></i>

            </button>


        </form>



        <!-- DIVIDER -->

        <div class="divider">

            <span></span>

            <small>
                OR
            </small>

            <span></span>

        </div>



        <!-- REGISTER -->

        <div class="register-text">

            <span>
                Don't have an account?
            </span>


            <a href="register.html">
                Create Account
            </a>

        </div>



        <!-- SECURITY -->

        <div class="security">

            <i class="fa-solid fa-shield-halved"></i>

            <span>
                Your information is securely protected.
            </span>

        </div>


    </section>


</main>



<!-- =====================================================
     LOGIN JAVASCRIPT
===================================================== -->

<script>

const password =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");


/* =====================================================
   SHOW / HIDE PASSWORD
===================================================== */

togglePassword.addEventListener(
    "click",
    function () {

        const icon =
            togglePassword.querySelector("i");


        if (password.type === "password") {

            password.type = "text";

            icon.classList.remove("fa-eye");

            icon.classList.add("fa-eye-slash");

            togglePassword.setAttribute(
                "aria-label",
                "Hide password"
            );

        } else {

            password.type = "password";

            icon.classList.remove("fa-eye-slash");

            icon.classList.add("fa-eye");

            togglePassword.setAttribute(
                "aria-label",
                "Show password"
            );

        }

    }
);


/* =====================================================
   LOGIN FORM
===================================================== */

document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        function (event) {

            event.preventDefault();

            const email =
                document.getElementById("email").value;

            const passwordValue =
                document.getElementById("password").value;


            if (!email || !passwordValue) {
                return;
            }


            /*
                Firebase Authentication
                එක පස්සේ මෙතන connect කරමු.
            */

            console.log(
                "Login:",
                email
            );

        }
    );


/* =====================================================
   FORGOT PASSWORD
===================================================== */

document
    .getElementById("forgotPassword")
    .addEventListener(
        "click",
        function (event) {

            event.preventDefault();

            alert(
                "Password reset එක Firebase Authentication එකට connect කරමු."
            );

        }
    );

</script>


</body>

</html>
